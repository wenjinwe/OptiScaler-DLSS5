; OptiScaler 集成重构版 v1.4.6 关键键示例（完整版见成品包内 OptiScaler.ini 73KB）
; 键名均为英文，不可汉化；菜单内改动优先于此文件

[General]
Enabled=auto
ShortcutKey=auto

[Upscalers]
UpscalerIndex=auto
Sharpness=auto

[FrameGen]
FGInput=auto
FGOutput=auto
InterpolationCount=auto
UnlockMFG=auto
FGNvngxReplacement=auto
StreamlineIgnoreOTA=true        ; v1.4.2：只用包内 streamline 全家桶，忽略驱动 OTA 缓存

[DLSSG]
AmpereMfgUnlock=true           ; v1.4.2：RTX 20/30 系内置 MFG 解锁（4X，与外部解锁件二选一）
AdaMfgUnlock=false             ; 实验性保持关闭（RTX 40 未验证）

[fakenvapi]
Dxgi=auto
ForceReflex=2                  ; v1.4.4：DLSSG 所需 Reflex 状态自动补全

[D3D12]
FsrAgilitySDKUpgrade=auto      ; v1.4.6：true 启用 D3D12Core.dll（Agility SDK 升级，Win10 老游戏开 FSR4）；回退 auto

[Plugins]
LoadAsiPlugins=auto            ; v1.4.6：true 启用 OptiPatcher.asi（ASI 插件）；回退 auto

[Logging]
LogToFile=false
LogLevel=4
LogAsync=true

[XeSS]
XeSSPath=auto
XeFGPath=auto
EnableXeSSInputs=true
BuildPipelines=true
CreateHeaps=true
UsePrecompiledShaders=true

[FramePacing]
FPTSafetyMarginInMs=0.75
FPTVarianceFactor=0.1
AllowedFrameAhead=1

[ValidNow]
DepthValidNow=false
VelocityValidNow=false
HudlessValidNow=false

[SwapChain]
PreserveSwapChain=true
SkipResizeBuffers=true
ModifyBufferState=auto
ModifySCIndex=auto

; =======================================================
; v1.4.6 可选增强组件说明（包内已有，默认不启用）
; 1) D3D12_OptiScaler\D3D12Core.dll —— DX12 Agility SDK 升级
;    用途：Win10 老游戏（如赛博朋克2077）启用 FSR4
;    启用：FsrAgilitySDKUpgrade=true（文件已在包内 OptiScaler\D3D12_OptiScaler\）
;    回退：FsrAgilitySDKUpgrade=auto（false）
; 2) plugins\OptiPatcher.asi —— ASI 插件（由 OptiScaler 加载）
;    启用：[Plugins] LoadAsiPlugins=true
;    回退：LoadAsiPlugins=auto（false）
; 两者均为可选增强，不影响默认运行路径（画质保护基线不变）
; =======================================================
; 画质保护基线（16.11）：画质相关键（[Upscalers]/[Sharpness]/[QualityOverrides]/
; [HDR]/[CAS]/[OutputScaling]/[DlssNr] 细节键）一律保持官方默认（auto / Precision=0 / 细节强度 1.0）
