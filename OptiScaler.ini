; OptiScaler.ini — v1.4.53 关键键示例（节选）
; 完整版（2151 行，中文注释全量）见成品包内 OptiScaler.ini
; 键名均为英文（勿改）；值 auto/false 为官方默认
; 基座：OptiScaler 神经渲染线 0.1.31（5d5cdccd，光学 F5Low）

; ============ [General] ============
[General]
; 主开关：true 启用 OptiScaler（游戏内 Insert 呼出菜单）
Enabled=true
; 菜单快捷键（默认 Insert，可改 Home/End 等）
ShortcutKey=auto

; ============ [Menu] ============
[Menu]
; 中文界面字体（微软雅黑；显示方块时确认系统已装）
TTFFontPath=msyh.ttc
; 光学 F5Low 一次性提示开关（false 关闭菜单头提示）
F5LowHint=false
; UI 大小默认自动（<900p 自动缩小）
MenuWidth=auto
MenuHeight=auto
Scale=auto
; 基准蓝主题（AccentColor 0.20/0.44/1.00）
AccentColor=0.20,0.44,1.00

; ============ [Plugins] ============
[Plugins]
; ASI 插件加载开关（0.1.31 菜单新增复选框）
; true 启用 plugins/MFGUnlocker.asi（开箱即用）+ OptiPatcher.asi；回退 auto 全部停用
LoadAsiPlugins=true

; ============ [Framerate] ============
[Framerate]
; 低延迟「仅限帧数」（0.1.31 新键）：把 FPS 上限等待移到游戏读取输入前
; 与 Reflex / Anti-Lag 2 / XeLL / LatencyFlex 并列可选
FrameCapOnly=auto
; 帧率上限（0=不限；由低延迟层控制）
FramerateLimit=0

; ============ [DLSSG] ============
[DLSSG]
; 内置 MFG 解锁（RTX 20/30 系 4X，纯配置；与外部解锁件二选一）
AmpereMfgUnlock=true
; RTX 40 系实验性解锁（未验证，保持关闭）
AdaMfgUnlock=false

; ============ [DlssNr] ============
[DlssNr]
; 神经渲染计算精度（0=自动 / 1=标准 / 4=FP8；用 switch_nr_precision.bat 切换）
Precision=0
; F5Low 帧生成提速（0.1.31 新键）：开启时后端不再跑超分遍，NR 直接作用于游戏原画面
NativeUpscalerPass=auto
; NR 场景切换检测（2=检测游戏未标记的摄像机切换）
SceneCut=auto

; ============ [FrameGen] ============
[FrameGen]
; 只用包内 streamline 全家桶，忽略驱动 OTA 缓存
StreamlineIgnoreOTA=true
; 帧生成输入/输出后端（菜单操作）
FGInput=auto
FGOutput=auto

; ============ [fakenvapi] ============
[fakenvapi]
; DLSSG 所需 Reflex 状态自动补全（2=强制 Reflex）
ForceReflex=2
; 显卡伪装（AMD/Intel 默认启用；异常设 false）
Dxgi=auto

; ============ [Hooks] ============
[Hooks]
; DX11 设备错误修复（启动失败的 DX11 游戏设 false）
D3D11FeatureLevelElevation=auto

; ============ [F5Low] ============
[F5Low]
; 光学 F5Low 总开关（无升频器游戏的 DLSS-NR）
F5Low=auto
; F5Low 低延迟（无 Reflex 游戏自动装 NVIDIA Reflex / Anti-Lag 2 / XeLL / LatencyFlex）
Latency=auto
; 曝光"原生"起点（保持游戏本色）
Native=auto

; ============ [Streamline] ============
[Streamline]
; Streamline 相关默认配置
LogLevel=4
LogToFile=false
