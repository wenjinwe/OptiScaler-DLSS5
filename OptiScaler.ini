; ═══════════════════════════════════════════════════════════
; OptiScaler.ini — 集成重构版 v1.4.47 关键键示例（节选）
; 完整版见成品包内 OptiScaler.ini（390 键，中文注释全量）
; ═══════════════════════════════════════════════════════════

[Upscalers]
; 超分器支持（DLSS / FSR / XeSS 自动选择）
UpscalerIndex=auto
; 锐化保持官方默认（画质保护基线）
Sharpness=auto

[Menu]
; 菜单面板
OverlayMenu=true
; UI 大小默认自动（<900p 自动缩小；可手动设固定值，如 MenuWidth=1200）
MenuWidth=auto
MenuHeight=auto
Scale=auto
; 菜单快捷键
ShortcutKey=auto
; 主题（基准蓝）
AccentColorR=0.20
AccentColorG=0.44
AccentColorB=1.00
BGColorR=0.05
BGColorG=0.06
BGColorB=0.10
; 字体
FontSize=17.0
TTFFontPath=C:\Windows\Fonts\msyh.ttc
; FPS 悬浮窗
ShowFps=true
FpsOverlayPos=1
FpsOverlayType=4
FpsOverlayHorizontal=true
; 光学 F5Low 一次性提示（0.1.27.2 新键；false 关闭菜单头提示）
F5LowHint=false

[FrameGen]
; 只使用包内 streamline 全家桶，忽略驱动 OTA 缓存版本
StreamlineIgnoreOTA=true
; 后端替换按需自动（Nukems/Arturs/FFX/Combo）
FGNvngxReplacement=auto
; 帧生成输入/输出
FGInput=auto
FGOutput=auto

[DLSSG]
; RTX 20/30 系内置 MFG 解锁（4X 上限，sideload dlssg_sm86；与外部解锁件二选一）
AmpereMfgUnlock=true
MaxFrames=3
; RTX 40 建议游戏原生 DLSSG；更高倍率用外部解锁件
AdaMfgUnlock=false
; 动态 MFG（游戏支持时自动生效）
ForceDMFG=auto
OverrideForceDMFG=auto
FramerateTargetDMFG=auto

[fakenvapi]
; Reflex 状态自动补全（DLSSG 所需）
ForceReflex=2

[Plugins]
LoadAsiPlugins=true

[Hooks]
; DX11 功能等级提升（F5 线基座修复项；启动因设备错误失败的 DX11 游戏可关）
D3D11FeatureLevelElevation=auto

; ═══════════════════════════════════════════════════════════
; 画质保护基线（禁止为性能改动画质键）
; Precision=0 / 细节强度 1.0 / 倍率 auto —— 保持官方默认
; 全局铁律：不损画质；保兼容/稳定/准确/实用/可靠/安全；留回退路径；个人隐私保护
; ═══════════════════════════════════════════════════════════
